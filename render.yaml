# Optional: Render Blueprint. You can also create the three pieces by hand (see README).
databases:
  - name: tripnest-db
    databaseName: tripnest_db
    user: tripnest
    plan: free

services:
  - type: web
    name: tripnest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: tripnest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_LOGINS
        value: "false"
      - key: OTP_DEV_MODE
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_SIGNUP_CODE
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

  - type: web
    name: tripnest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
